services:
  cine-app:
    build: .
    container_name: tanstack-cine
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Sincronizamos la zona horaria para que el reset dominical no falle
      - TZ=America/Mexico_City
      - APP_PASSWORD=Tamiko666
    volumes:
      - ./movies_dir:/movies:ro
      - ./app_data:/data
